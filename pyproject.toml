[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "figured"
version = "0.4.3"
description = "Show your work: deterministic online evals that trace every number in an LLM answer, and every value an agent passes to a tool, to its source."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nishesh Shukla" }]
keywords = ["llm", "hallucination", "grounding", "text-to-sql", "faithfulness", "evaluation", "online-eval", "guardrails", "observability", "agents", "tool-calling", "provenance", "prompt-injection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
judge = ["anthropic>=1.0", "pydantic>=2.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/nisheshshukla/figured"
Repository = "https://github.com/nisheshshukla/figured"
Issues = "https://github.com/nisheshshukla/figured/issues"
Changelog = "https://github.com/nisheshshukla/figured/blob/main/CHANGELOG.md"

[project.scripts]
figured = "figured.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/figured"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["−", "–", "—", "÷", "±", "×"]

[tool.ruff.lint.per-file-ignores]
"src/figured/judge.py" = ["E501"]
"tests/*" = ["RUF012"]
"benchmarks/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/figured"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*", "pydantic"]
ignore_missing_imports = true

[tool.coverage.run]
omit = ["src/figured/judge.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["perf: latency budgets and scaling guards (loose bounds, so CI passes; `-m 'not perf'` skips them)"]
